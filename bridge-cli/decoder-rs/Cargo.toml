[package]
name = "decoder-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.95"
bech32 = "0.11"
clap = { version = "4.5.23", features = ["derive", "env"] }
dotenvy = "0.15"
hex = "0.4.3"
num-bigint = "0.4.6"
num-traits = "0.2"
rand = "0.8.5"
reqwest = { version = "0.12.9", features = ["json", "rustls-tls"] }
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
sha2 = "0.10.8"
tokio = { version = "1.41.1", features = ["macros", "rt-multi-thread"] }

midnight-node-ledger-helpers = { git = "https://github.com/midnightntwrk/midnight-node", tag = "node-0.22.2", package = "midnight-node-ledger-helpers", features = [
    "can-panic",
] }
# Do not add `midnight-node-toolkit` as a library dep: it pulls partner-chains → sp-core → parity-bip39,
# which pins `unicode-normalization = "=0.1.22"` and conflicts with `bip39` (via ledger-helpers) using ^0.1.22 → 0.1.25.
# Toolkit integration tests shell out to the `midnight-node-toolkit` binary (TOOLKIT_BIN), not this crate.
# Ledger 8: must match @midnight-ntwrk/ledger-v8 / compact-runtime used by bridge-cli (see package.json).
midnight-ledger = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-8.0.3", package = "midnight-ledger", features = [
    "proving",
] }
midnight-onchain-runtime = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-8.0.3", package = "midnight-onchain-runtime" }
midnight-onchain-state = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-8.0.3" }
serialize = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-8.0.3", package = "midnight-serialize" }
midnight-storage = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-8.0.3", package = "midnight-storage" }
base_crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-8.0.3", package = "midnight-base-crypto" }
transient_crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-8.0.3", package = "midnight-transient-crypto" }

# Own workspace root so nested sovereign-sdk checkout does not absorb this crate.
[workspace]
