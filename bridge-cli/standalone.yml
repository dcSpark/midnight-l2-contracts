services:
  proof-server:
    container_name: 'bridge-proof-server'
    image: 'midnightntwrk/proof-server:8.0.3'
    command: ['midnight-proof-server', '-v']
    ports:
      - '6300:6300'
    environment:
      RUST_BACKTRACE: 'full'
    volumes:
      - './.cache/midnight/zk-params:/.cache/midnight/zk-params'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:6300/version']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
  indexer:
    container_name: 'bridge-indexer'
    image: 'midnightntwrk/indexer-standalone:4.0.0'
    ports:
      - '8088:8088'
    environment:
      RUST_LOG: 'indexer=debug,chain_indexer=debug,indexer_api=debug,wallet_indexer=debug,indexer_common=debug,fastrace_opentelemetry=off,info'
      APP__INFRA__NODE__URL: 'ws://node:9944'
      APP__APPLICATION__NETWORK_ID: 'undeployed'
      APP__INFRA__STORAGE__PASSWORD: 'indexer'
      APP__INFRA__PUB_SUB__PASSWORD: 'indexer'
      APP__INFRA__LEDGER_STATE_STORAGE__PASSWORD: 'indexer'
      APP__INFRA__SECRET: '303132333435363738393031323334353637383930313233343536373839303132'
    healthcheck:
      test: ['CMD-SHELL', 'cat /var/run/indexer-standalone/running']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      node:
        condition: service_started
  node:
    image: 'midnightntwrk/midnight-node:0.22.1'
    container_name: 'bridge-node'
    ports:
      - '9944:9944'
    # logging:
    #   driver: 'json-file'
    #   options:
    #     max-size: '50m'
    #     max-file: '5'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9944/health']
      interval: 2s
      timeout: 5s
      retries: 5
      start_period: 40s
    environment:
      CFG_PRESET: 'dev'
      # APPEND_ARGS: '--rpc-methods=Unsafe'
      # RUST_BACKTRACE: '1'
      # RUST_LOG: 'runtime=debug,wasm=debug,substrate=debug,sc_rpc=debug,info'
