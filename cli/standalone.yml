services:
  proof-server:
    container_name: 'midnight-proof-server'
    # Using midnightnetwork proof server aligned with ledger 6.1.x
    image: 'midnightnetwork/proof-server:6.1.0-alpha.6'
    command: ['midnight-proof-server', '--network', 'undeployed']
    ports:
      - '6300'
    environment:
      RUST_BACKTRACE: 'full'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:6300/version']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  indexer:
    container_name: 'midnight-indexer'
    # Using midnightnetwork pubsub-indexer aligned with ledger 6.1.x
    image: 'midnightnetwork/midnight-pubsub-indexer:2.3.0'
    ports:
      - '8088'
    environment:
      INDEXER_NODE_URL: 'ws://node:9944'
      INDEXER_NETWORK_ID: 'undeployed'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8088/api/v1/graphql']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      node:
        condition: service_healthy

  node:
    # Using midnightnetwork node aligned with ledger 6.1.x
    image: 'midnightnetwork/midnight-node:0.12.1'
    container_name: 'midnight-node'
    command: ['--dev', '--unsafe-rpc-external', '--rpc-methods=unsafe']
    ports:
      - '9944'
    volumes:
      - node-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9944/health']
      interval: 2s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  node-data:
