services:
  proof-server:
    container_name: 'midnight-proof-server'
    # Using public meshsdk proof server (works without auth)
    image: 'meshsdk/midnight-proof-server:1.0.0'
    ports:
      - '6300'
    environment:
      RUST_BACKTRACE: 'full'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:6300/version']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  indexer:
    container_name: 'midnight-indexer'
    # Using public indexer image
    image: 'midnightntwrk/indexer-standalone:3.0.0-alpha.20'
    ports:
      - '8088'
    environment:
      RUST_LOG: 'indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info'
      APP__INFRA__NODE__URL: 'ws://node:9944'
      APP__APPLICATION__NETWORK_ID: 'undeployed'
      APP__INFRA__SECRET: '303132333435363738393031323334353637383930313233343536373839303132'
    healthcheck:
      test: ['CMD-SHELL', 'cat /var/run/indexer-standalone/running || curl -f http://localhost:8088/api/v3/graphql']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      node:
        condition: service_healthy

  node:
    # Using public node with dev preset (has pre-funded genesis for seeds 0x01-0x04)
    image: 'midnightntwrk/midnight-node:0.18.0'
    container_name: 'midnight-node'
    ports:
      - '9944'
    volumes:
      - node-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9944/health']
      interval: 2s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      # CFG_PRESET=dev loads genesis with funded wallets for seeds 0x01-0x04
      CFG_PRESET: 'dev'
      SIDECHAIN_BLOCK_BENEFICIARY: '04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e'

volumes:
  node-data:
